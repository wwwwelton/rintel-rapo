<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Rintel RAPO</title>
<style>
  body { margin: 0; background: #0f1115; color: #e6e6e6; font-family: "Segoe UI", sans-serif; }
  .rapo-header { display: flex; align-items: center; gap: 12px; padding: 16px; flex-wrap: wrap; }
  .rapo-header h1 { font-size: 22px; margin: 0; }
  .badge { font-size: 11px; padding: 3px 8px; border-radius: 4px; border: 1px solid currentColor; }
  .badge-accent { color: #4fc3f7; }
  .badge-warning { color: #ffd54f; }
  .badge-muted { color: #9e9e9e; }
  .actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  button { background: #1c1f26; color: inherit; border: 1px solid #333; padding: 6px 10px; border-radius: 4px; cursor: pointer; }
  button:disabled { opacity: 0.4; cursor: default; }
</style>
</head>
<body>
<div id="app"></div>
<div id="games"></div>
<script type="module">
  import init, { render_header_json, render_games_json } from "./rapo_ui.js";
  await init();
  const app = document.getElementById("app");
  const games = document.getElementById("games");
  const send = (el) => window.ipc.postMessage(JSON.stringify({ action: el.dataset.action, dir: el.dataset.dir ?? null, checked: el.checked ?? null }));
  games.addEventListener("change", (e) => { if (e.target.matches("input[data-action]")) send(e.target); });
  games.addEventListener("click", (e) => { const b = e.target.closest("button[data-action]"); if (b && !b.disabled) send(b); });
  // Host pushes `{ header, games }` (games = GamesView) to re-render without reloading.
  window.rapoUpdate = (state) => {
    app.innerHTML = render_header_json(JSON.stringify(state.header));
    games.innerHTML = render_games_json(JSON.stringify(state.games));
  };
  window.rapoUpdate({ header: window.INITIAL_HEADER, games: window.INITIAL_GAMES });
</script>
</body>
</html>
