<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self'; object-src 'none'; base-uri 'none'">
<title>Rintel RAPO</title>
<style>
  :root {
    color-scheme: dark;
    --page: #07090f;
    --panel: #0c0f16;
    --surface: #10151d;
    --surface-hover: #18242a;
    --border: #252d37;
    --text: #f5f7fb;
    --muted: #a2adb9;
    --accent: #65e5d1;
    --warning: #f0cf89;
    --danger: #ff9b9f;
    --mono: "Cascadia Code", Consolas, "SFMono-Regular", monospace;
    font: 14px/1.6 "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--page);
    color: var(--text);
  }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; min-width: 0; background: var(--page); }
  main { width: 100%; max-width: 1440px; margin: 0 auto; padding: 28px 40px 48px; }
  #app, #training, #dashboard, #games, main > * { min-width: 0; }
  section, article, .game, .rapo-header {
    min-width: 0; margin: 0 0 20px; padding: 26px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
    overflow-wrap: anywhere;
  }
  h1, h2, h3, p, dl { margin-top: 0; }
  h1 { margin-bottom: 0; font-size: 22px; font-weight: 650; letter-spacing: -.045em; line-height: 1.25; }
  h2, h3, .section-heading {
    margin-bottom: 18px; color: var(--muted); font: 600 12px/1.6 var(--mono);
    letter-spacing: .08em; text-transform: uppercase;
  }
  h3 { margin-top: 24px; margin-bottom: 10px; }
  p, dd { color: var(--muted); line-height: 1.7; }
  p { margin-bottom: 14px; }
  p:last-child { margin-bottom: 0; }
  strong, b { color: var(--text); font-weight: 650; }
  small { font-size: 12px; }
  code, pre { font-family: var(--mono); font-size: 12px; }
  pre { padding: 16px; background: var(--page); border-radius: 8px; white-space: pre-wrap; overflow-wrap: anywhere; }
  ul { padding: 0; list-style: none; }
  hr { width: 100%; border: 0; border-top: 1px solid var(--border); margin: 18px 0; }
  .rapo-header, .header-identity, .header-status, .actions, .hero-actions, .hero-meta, .section-heading {
    display: flex; align-items: center; flex-wrap: wrap; gap: 10px;
  }
  .rapo-header { gap: 12px 18px; padding: 16px 24px; }
  .header-identity { flex: 1 1 auto; gap: 14px; }
  .header-copy { min-width: 0; }
  .product-mark {
    display: grid; place-items: center; width: 44px; height: 44px; flex: 0 0 44px;
    background: var(--accent); color: var(--page); border-radius: 12px;
    font: 700 13px/1 var(--mono); letter-spacing: -.05em;
  }
  .header-copy .hero-eyebrow { margin: 0 0 3px; font-size: 10px; }
  .header-status { gap: 8px; }
  .actions { margin-left: auto; }
  .hero-copy { min-width: 0; }
  .hero-eyebrow { margin-bottom: 14px; color: var(--accent); font: 500 11px/1.6 var(--mono); letter-spacing: .12em; text-transform: uppercase; }
  .hero-title {
    max-width: 20ch; margin: 0 0 24px; color: var(--text);
    font: 650 clamp(26px, 3vw, 40px)/1.08 "Segoe UI", sans-serif;
    letter-spacing: -.055em; text-transform: none;
  }
  .hero-description { max-width: 88ch; margin-bottom: 14px; font-size: 14px; }
  .hero-actions { margin: 20px 0; gap: 10px; }
  .actions.hero-actions { margin-top: 0; margin-bottom: 0; }
  .hero-meta { color: var(--muted); font: 11px/1.7 var(--mono); }
  .hero-meta p { margin-bottom: 6px; }
  .training { padding: 36px; border-radius: 22px; background: radial-gradient(ellipse at top right, #173132 0, transparent 65%), var(--panel); box-shadow: 0 18px 50px #0000003d; }
  .badge {
    display: inline-flex; align-items: center; max-width: 100%; padding: 4px 9px;
    border: 1px solid var(--border); border-radius: 6px; color: var(--muted);
    font: 500 10px/1.5 var(--mono); letter-spacing: .035em; overflow-wrap: anywhere;
  }
  .badge-accent { color: var(--accent); border-color: #365a43; background: #1b2c21; }
  .badge-warning { color: var(--warning); border-color: #5b4c30; background: #29251b; }
  .badge-muted { color: var(--muted); background: var(--surface); }
  button, input, select, textarea { max-width: 100%; font: inherit; color: var(--text); }
  button, input:not([type="checkbox"]), select, textarea {
    min-height: 40px; padding: 9px 13px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 8px;
    transition: background-color .15s ease, border-color .15s ease, color .15s ease;
  }
  button { cursor: pointer; font-size: 12px; font-weight: 600; line-height: 1.5; white-space: normal; overflow-wrap: anywhere; }
  button:hover:not(:disabled) { background: var(--surface-hover); border-color: #698b76; }
  #btn-toggle, #training-toggle[data-action="start_training"], button[data-action="relay-configure"] {
    background: var(--text); border-color: var(--text); color: #101713;
  }
  #btn-toggle:hover:not(:disabled), #training-toggle[data-action="start_training"]:hover:not(:disabled),
  button[data-action="relay-configure"]:hover:not(:disabled) { background: var(--accent); border-color: var(--accent); color: #101713; }
  button[aria-pressed="true"] { color: var(--accent); background: #20372a; border-color: #52775f; }
  button:disabled, input:disabled, select:disabled, textarea:disabled { opacity: .48; cursor: not-allowed; }
  fieldset:disabled { color: var(--muted); }
  input::placeholder, textarea::placeholder { color: #87958c; opacity: 1; }
  input:not([type="checkbox"]), select, textarea { min-width: 0; }
  select { cursor: pointer; }
  textarea { width: 100%; min-height: 96px; resize: vertical; font: 12px/1.6 var(--mono); }
  input[type="checkbox"] {
    appearance: none; -webkit-appearance: none; display: inline-block; vertical-align: middle;
    flex: 0 0 auto; width: 35px; height: 20px; margin: 0 5px 0 0;
    border: 1px solid #58675e; border-radius: 999px; cursor: pointer;
    background: radial-gradient(circle at 10px 50%, #b1beb5 0 7px, transparent 7.5px), #252e28;
    transition: background-color .15s ease, border-color .15s ease;
  }
  input[type="checkbox"]:checked {
    border-color: var(--accent);
    background: radial-gradient(circle at 25px 50%, var(--accent) 0 7px, transparent 7.5px), rgba(101,229,209,.24);
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
  label { color: var(--text); font-size: 12px; }
  label:where(:has(input[type="checkbox"])) { display: inline-flex; align-items: center; gap: 8px; min-height: 34px; cursor: pointer; }
  label:has(input:disabled), fieldset:disabled label { cursor: not-allowed; }
  fieldset { min-width: 0; margin: 18px 0; padding: 18px; border: 1px solid var(--border); border-radius: 10px; }
  legend { max-width: 100%; padding: 0 8px; color: var(--muted); font: 11px/1.6 var(--mono); }
  details { min-width: 0; margin-top: 14px; border: 1px solid var(--border); border-radius: 8px; background: #111713; }
  summary { padding: 12px 14px; color: var(--text); cursor: pointer; font-size: 12px; font-weight: 600; }
  summary::marker { color: var(--accent); }
  details[open] > summary { margin-bottom: 14px; border-bottom: 1px solid var(--border); }
  details > :not(summary) { margin-left: 14px; margin-right: 14px; }
  details > :last-child { margin-bottom: 14px; }
  table { width: 100%; table-layout: fixed; border-collapse: collapse; text-align: left; font-size: 12px; }
  th { color: var(--muted); font: 500 10px/1.6 var(--mono); letter-spacing: .06em; text-transform: uppercase; }
  th, td { padding: 12px 10px; border-bottom: 1px solid var(--border); vertical-align: top; overflow-wrap: anywhere; }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr:hover { background: #1c2820; }
  .alert, #ui-error { color: var(--danger); font-weight: 600; overflow-wrap: anywhere; }
  #ui-error:empty { margin: 0; }
  .telemetry-grid, .net-grid, .property-grid, .parameters, .core-grid { display: grid; gap: 12px; margin: 18px 0 0; }
  .telemetry-grid { grid-template-columns: repeat(auto-fit, minmax(min(100%, 210px), 1fr)); }
  .net-grid { grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); align-items: start; }
  .property-grid { grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); }
  .parameters { grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); gap: 14px; }
  .core-grid { grid-template-columns: repeat(auto-fill, minmax(min(100%, 150px), 1fr)); gap: 10px; }
  .telemetry-box, .net-card, .property-box, .parameter, .core-box {
    min-width: 0; padding: 18px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface);
  }
  .telemetry-box, .net-card { display: flex; flex-direction: column; gap: 7px; }
  .box-label, .net-card-label, .parameter dt {
    color: var(--muted); font: 500 10px/1.6 var(--mono); letter-spacing: .07em; text-transform: uppercase;
  }
  .box-value { color: var(--text); font-size: 26px; font-weight: 600; line-height: 1.25; letter-spacing: -.035em; }
  .box-value-text { font-size: 15px; font-weight: 600; line-height: 1.5; letter-spacing: 0; }
  .box-sub, .net-card-sub, .parameter small { color: var(--muted); font-size: 12px; line-height: 1.65; }
  .net-card-value { color: var(--text); font-size: 20px; font-weight: 600; line-height: 1.4; letter-spacing: -.025em; }
  .net-card-active, .parameter-on { border-color: #3c5c47; }
  .net-card-active .net-card-value { color: var(--accent); }
  .net-card-warn { border-color: #5b4c30; }
  .net-card-warn .net-card-value { color: var(--warning); }
  .net-card-off .net-card-value { color: var(--muted); }
  .hy2-status { display: block; margin: 8px 0; padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .hy2-on { color: var(--accent); border-color: #3c5c47; background: #1b2c21; }
  .hy2-pending { color: var(--warning); border-color: #5b4c30; }
  .hy2-error { color: var(--danger); border-color: #6b3434; }
  .telemetry-box-wide, .net-card-wide, .net-card:has(details), .relay-card, .vpn-profiles { grid-column: 1 / -1; }
  .net-history { margin: 4px 0 0; }
  .net-history li { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; padding: 9px 0; border-bottom: 1px solid var(--border); color: var(--muted); font: 11px/1.6 var(--mono); }
  .net-history li:last-child { border-bottom: 0; }
  .net-history li span:last-child { color: var(--accent); }
  .net-history li span.icmp-fail { color: var(--warning); }
  .vpn-profiles { padding: 20px 22px; border: 1px solid var(--border); border-radius: 14px; background: var(--surface); }
  .vpn-list { list-style: none; margin: 12px 0; padding: 0; display: grid; gap: 8px; }
  .vpn-list li { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; }
  .vpn-name { flex: 1 1 160px; min-width: 0; overflow-wrap: anywhere; font-weight: 600; }
  .vpn-form { display: grid; gap: 6px; margin-top: 10px; }
  .vpn-form[hidden] { display: none; }
  .vpn-form input, .vpn-form textarea, #vpn-editor select, #vpn-editor > input { width: 100%; }
  .net-policy-table { margin: 8px 0; }
  .net-disclaimer { display: block; color: var(--muted); font-size: 11px; line-height: 1.7; margin-top: 8px; }
  .relay-predictions { min-width: 0; max-width: 100%; overflow-x: auto; }
  .core-box { display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; transition: border-color .2s ease; }
  .core-box.core-p { border-color: #3c5c47; }
  .core-header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 6px; }
  .core-num, .core-header .badge { white-space: nowrap; }
  .core-num { color: var(--muted); font: 600 12px/1.4 var(--mono); }
  .core-pct { color: var(--text); font: 700 22px/1.1 var(--mono); letter-spacing: -.03em; }
  .core-header .badge { padding: 2px 6px; font-size: 10px; }
  .core-bar-bg { width: 100%; height: 8px; background: #29362e; border-radius: 4px; overflow: hidden; }
  .core-bar-fill { height: 100%; border-radius: 5px; transition: width .2s ease; }
  .core-low { background: var(--accent); }
  .core-med { background: var(--warning); }
  .core-high { background: var(--danger); }
  .cache-badges, .applied-settings { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
  .property-box { display: flex; align-items: flex-start; gap: 12px; }
  .property-toggle { width: 100%; margin: 0; }
  label.property-toggle { align-items: flex-start; gap: 12px; }
  .property-toggle input { margin-top: 2px; }
  .property-text { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .property-name { color: var(--text); font-size: 13px; font-weight: 600; }
  .property-desc { color: var(--muted); font-size: 12px; line-height: 1.6; }
  .property-box-action { flex-direction: column; justify-content: space-between; gap: 14px; }
  .btn-elevate { align-self: flex-start; color: var(--accent); }
  .parameter { display: flex; flex-direction: column; gap: 8px; padding: 18px 20px; }
  .parameter dd { margin: 0; color: var(--text); font-size: 20px; font-weight: 600; line-height: 1.3; }
  .parameter small { display: block; }
  .parameter-on { background: linear-gradient(180deg, #1b2c21, var(--surface)); box-shadow: inset 3px 0 0 var(--accent); }
  .parameter-on dd { color: var(--accent); }
  .parameter-off { border-style: dashed; opacity: .8; }
  .training-live, .profile-applied { border-color: #52775f; }
  .training-paused { border-color: #8d7445; }
  .training h3, .profile-summary h3 { color: var(--accent); }
  .training-paused h3 { color: var(--warning); }
  .profile-source { margin: 4px 0 12px; color: var(--text); font-size: 21px; font-weight: 600; }
  .applied-settings { margin-bottom: 20px; }
  .applied-settings span { padding: 8px 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; color: var(--muted); font-size: 12px; }
  .best-score { padding: 14px 16px; border-left: 2px solid var(--accent); background: #1b2c21; border-radius: 0 8px 8px 0; color: var(--accent); }
  .power-plan { border-left: 2px solid #52775f; }
  .targets { display: flex; flex-wrap: wrap; gap: 8px; margin: 20px 0; }
  .targets li { min-width: 0; max-width: 100%; }
  .game { display: flex; align-items: center; flex-wrap: wrap; gap: 14px 20px; padding: 20px 24px; margin-bottom: 10px; }
  .game:hover { border-color: #52775f; }
  .name { flex: 1 1 220px; min-width: 0; color: var(--text); font-size: 15px; font-weight: 600; }
  .game label { flex: 0 1 auto; color: var(--muted); }
  .search-bar { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; margin: 28px 0 16px; }
  .search-bar label { font: 11px/1.6 var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .search-bar input { flex: 1 1 280px; max-width: 480px; }
  #network-routes fieldset { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; }
  #network-routes h3, #network-routes fieldset p, .network-choice { flex-basis: 100%; }
  #network-routes fieldset p { margin-bottom: 4px; }
  #network-routes fieldset > input:not([type="checkbox"]), #network-routes fieldset > select { flex: 1 1 220px; }
  label.network-choice { display: flex; align-items: flex-start; padding: 8px 0; gap: 10px; color: var(--muted); overflow-wrap: anywhere; }
  .network-choice input { margin-top: 2px; }
  #relay-transport { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
  #relay-transport input, #relay-transport select, #relay-transport textarea { width: 100%; }
  #relay-transport button { justify-self: start; margin-top: 8px; }
  [hidden] { display: none !important; }
  .page-subtitle { margin-bottom: 16px; }
  .library-note { margin: 4px 2px 0; font-size: 12px; }
  .route-warning { padding: 12px 14px; border-left: 2px solid var(--warning); background: #29251b; border-radius: 0 8px 8px 0; color: var(--text); }
  details.how-it-works { margin: 14px 0; }
  .sticky-nav { position: sticky; top: 0; z-index: 5; margin: 0 0 20px; padding: 8px 0 0; background: var(--page); }
  .summary-strip {
    display: flex; flex-wrap: wrap; gap: 8px 28px; align-items: baseline;
    margin: 0 0 8px; padding: 10px 20px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 12px;
  }
  .summary-strip:empty { display: none; }
  .summary-item { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .summary-label { color: var(--muted); font: 500 10px/1.4 var(--mono); letter-spacing: .08em; text-transform: uppercase; }
  .summary-value { color: var(--text); font-size: 15px; font-weight: 600; letter-spacing: -.02em; overflow-wrap: anywhere; }
  .summary-ok { color: var(--accent); }
  .summary-warn { color: var(--warning); }
  .summary-off { color: var(--muted); }
  .summary-target { margin-left: auto; text-align: right; }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 4px; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; }
  .tabs button { flex: 1 1 0; min-height: 38px; padding: 8px 14px; background: transparent; border-color: transparent; color: var(--muted); }
  .tabs button:hover:not(:disabled) { background: var(--surface-hover); border-color: transparent; color: var(--text); }
  .tabs button[aria-selected="true"] { background: var(--surface); border-color: #52775f; color: var(--accent); box-shadow: inset 0 -2px 0 var(--accent); }
  /* Training hero: same content, less vertical space. */
  .training { padding: 26px 30px; border-radius: 16px; }
  .training .hero-eyebrow { margin-bottom: 8px; }
  .training .hero-title { margin-bottom: 14px; font-size: clamp(22px, 2.2vw, 28px); max-width: none; }
  .training .hero-description { font-size: 13px; }
  @media (max-width: 900px) {
    main { padding: 22px 24px 36px; }
    .rapo-header { gap: 16px; }
    .header-identity { flex-basis: 50%; }
    .actions { width: 100%; margin-left: 0; padding-top: 14px; border-top: 1px solid var(--border); }
    .training { padding: 28px; }
  }
  @media (max-width: 560px) {
    main { padding: 14px 14px 28px; }
    section, article, .game, .rapo-header { padding: 18px; margin-bottom: 14px; }
    .training { padding: 24px 20px; }
    .header-identity { flex-basis: 100%; }
    .hero-title { font-size: 27px; }
    .hero-actions > button { width: 100%; }
    .actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .actions .badge { grid-column: 1 / -1; justify-self: start; }
    .telemetry-grid, .net-grid, .property-grid, .parameters { gap: 10px; }
    .telemetry-box, .net-card, .property-box, .parameter { padding: 16px; }
    .parameters { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .core-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .core-box { padding: 10px; }
    .core-pct { font-size: 18px; }
    .core-header .badge { padding: 1px 4px; font-size: 9px; }
    .game { align-items: stretch; gap: 12px; }
    .name, .game label, .game button { flex-basis: 100%; }
    .search-bar { margin-top: 22px; }
    .search-bar input { max-width: 100%; width: 100%; }
    fieldset { padding: 12px; }
    #network-routes fieldset > button { width: 100%; }
    #network-routes fieldset > label:not(.network-choice) { flex-basis: 100%; }
    th, td { padding: 9px 5px; font-size: 11px; }
    th { font-size: 9px; letter-spacing: 0; }
    details > :not(summary) { margin-left: 10px; margin-right: 10px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
  }
  @media (forced-colors: active) {
    input[type="checkbox"] { appearance: auto; -webkit-appearance: auto; background: none; }
  }
</style>
</head>
<body><main>
<div id="app"></div>
<div class="sticky-nav">
<div id="summary" class="summary-strip" role="status" aria-live="off"></div>
<nav class="tabs" role="tablist" aria-label="Seções do painel">
  <button type="button" role="tab" id="tab-overview" data-tab-target="overview" aria-controls="pane-overview">Visão geral</button>
  <button type="button" role="tab" id="tab-network" data-tab-target="network" aria-controls="pane-network">Rede</button>
  <button type="button" role="tab" id="tab-profile" data-tab-target="profile" aria-controls="pane-profile">Perfil</button>
  <button type="button" role="tab" id="tab-system" data-tab-target="system" aria-controls="pane-system">Sistema</button>
  <button type="button" role="tab" id="tab-games" data-tab-target="games" aria-controls="pane-games">Jogos</button>
</nav>
</div>
<div id="dashboard"></div>
<div class="tab-pane" data-tab="overview" id="pane-overview" role="tabpanel" aria-labelledby="tab-overview"><div id="training"></div></div>
<div class="tab-pane" data-tab="games" id="pane-games" role="tabpanel" aria-labelledby="tab-games" hidden>
<div class="search-bar"><label for="search">Buscar jogo</label> <input id="search" type="search" placeholder="Buscar jogo na biblioteca Steam..."></div>
<div id="games"></div>
</div>
<p id="ui-error" role="alert"></p>
</main>
<script type="module">
  import init, { render_header_json, render_games_json, render_training_json, render_dashboard_json, render_summary_json } from './rapo_ui.js';
  const error = document.getElementById('ui-error');
  try {
    await init();
    const search = document.getElementById('search');
    const send = (el) => {
      error.textContent = '';
      const action = el.dataset.action;
      const payload = { action, dir: el.dataset.dir ?? null, checked: el.checked ?? null, pid: el.dataset.pid ? Number(el.dataset.pid) : null };
      const field = (id) => document.getElementById(id);
      if (el.dataset.key) payload.key = el.dataset.key;
      if (action === 'vpn-activate' || action === 'vpn-remove') payload.name = el.dataset.name;
      if (action === 'vpn-save') {
        const protocol = field('vpn-protocol').value;
        const form = document.querySelector(`[data-vpn-form="${protocol}"]`);
        const read = (kind, name) => field(`vpn-${protocol}-${kind}-${name}`).value;
        payload.protocol = protocol;
        payload.name = field('vpn-name').value.trim();
        payload.fields = Object.fromEntries(form.dataset.fields.split(',').filter(Boolean).map(name => [name, read('f', name).trim()]).filter(([, value]) => value));
        payload.secrets = Object.fromEntries(form.dataset.secrets.split(',').filter(Boolean).map(name => [name, read('s', name)]));
        if (!payload.name) { error.textContent = 'Informe um nome para o perfil.'; return; }
        // Secrets are sent once and cleared; the host never sends them back.
        form.querySelectorAll('input[type=password]').forEach(input => { input.value = ''; });
      }
      if (action === 'relay-interfaces') payload.candidates = [...document.querySelectorAll('[data-relay-candidate]:checked')].map(input => input.dataset.relayCandidate);
      if (action === 'relay-configure') {
        payload.mode = field('relay-mode').value;
        payload.server = field('relay-server').value.trim();
        payload.server_name = field('relay-server-name').value.trim();
        payload.auth = field('relay-auth').value;
        payload.ca_pem = field('relay-ca').value;
        if (['hy2', 'neural_auto'].includes(payload.mode) && Boolean(payload.server) !== Boolean(payload.auth)) {
          error.textContent = 'Informe servidor e autenticação HY2, ou deixe ambos vazios para usar o servidor integrado ao RAPO.'; return;
        }
        field('relay-auth').value = '';
      }
      if (action === 'udp-redundancy-toggle' || action === 'udp-redundancy-save') {
        payload.action = 'udp-redundancy';
        payload.enabled = field('udp-red-enabled')?.checked === true;
        payload.x = parseInt(field('udp-red-x')?.value || '20', 10);
        payload.y = parseInt(field('udp-red-y')?.value || '10', 10);
        if (isNaN(payload.x) || payload.x < 1 || payload.x > 30 || isNaN(payload.y) || payload.y < 1 || payload.y > 30) {
          error.textContent = 'Valores X e Y devem estar entre 1 e 30.'; return;
        }
      }
      if (action === 'udp-redundancy-auto-toggle' || action === 'udp-redundancy-auto-save') {
        payload.action = 'udp-redundancy-auto';
        payload.enabled = field('udp-red-auto')?.checked === true;
        payload.echo = field('udp-red-echo')?.value.trim() || '';
      }
      if (action.startsWith('route-') || action.startsWith('rate-')) {
        payload.destination = el.dataset.destination ?? field('route-destination')?.value.trim();
        payload.candidate = field('route-candidate')?.value;
        payload.consent = field('network-consent')?.checked === true;
        payload.candidates = [...document.querySelectorAll('[data-route-candidate]:checked')].map(input => input.dataset.routeCandidate);
        payload.mb_s = field('rate-mbs')?.value.trim();
        payload.rates = (field('rate-list')?.value ?? '').split(',').map(value => value.trim());
        const rateValid = (value) => /^\d+(\.\d{1,6})?$/.test(value) && /[1-9]/.test(value);
        if (['route-apply', 'route-learn', 'rate-learn'].includes(action) && !payload.destination) { error.textContent = 'Informe um IP de destino numérico.'; return; }
        if (action === 'route-apply' && !payload.candidate) { error.textContent = 'Selecione uma interface/gateway existente.'; return; }
        if (action.endsWith('-learn') && !payload.consent) { error.textContent = 'Confirme explicitamente o consentimento aos testes ativos de rede.'; return; }
        if (action === 'route-learn' && payload.candidates.length < 2) { error.textContent = 'Selecione a saída atual e pelo menos outra saída da mesma família.'; return; }
        if (action === 'rate-apply' && !rateValid(payload.mb_s ?? '')) { error.textContent = 'Informe MB/s decimal positivo com até 6 casas.'; return; }
        if (action === 'rate-learn' && (payload.rates.length < 2 || !payload.rates.every(rateValid))) { error.textContent = 'Autorize pelo menos duas taxas MB/s positivas, separadas por vírgula.'; return; }
      }
      window.ipc.postMessage(JSON.stringify(payload));
    };
    document.addEventListener('click', (e) => { const b = e.target.closest('button[data-action]'); if (b && !b.disabled) send(b); });
    document.addEventListener('change', (e) => {
      if (e.target.matches('input[data-action]')) send(e.target);
      if (e.target.id === 'vpn-protocol') showVpnForm();
      if (e.target.matches('input[data-vpn-file]')) importVpnFile(e.target);
    });
    // Shows only the form of the selected protocol; re-applied after every render because innerHTML drops `hidden`.
    const showVpnForm = () => {
      const select = document.getElementById('vpn-protocol');
      if (!select) return;
      document.querySelectorAll('[data-vpn-form]').forEach(form => { form.hidden = form.dataset.vpnForm !== select.value; });
    };
    // The page reads the chosen file and sends its text; the host never receives or opens a path.
    const importVpnFile = async (input) => {
      const file = input.files[0];
      input.value = '';
      if (!file) return;
      if (file.size > 65536) { error.textContent = 'Arquivo grande demais para um perfil de VPN (máximo 64 KiB).'; return; }
      const name = document.getElementById('vpn-name').value.trim() || file.name.replace(/\.[^.]+$/, '');
      window.ipc.postMessage(JSON.stringify({ action: 'vpn-import', protocol: input.dataset.vpnFile, name, text: await file.text() }));
    };
    const previous = new Map();
    // Tab routing: #dashboard is re-rendered with innerHTML, which drops `hidden`, so the active tab is re-applied after every render.
    const TABS = ['overview', 'network', 'profile', 'system', 'games'];
    let activeTab = TABS.includes(sessionStorage.getItem('rapo-tab')) ? sessionStorage.getItem('rapo-tab') : 'overview';
    const applyTab = () => {
      document.querySelectorAll('.tab-pane[data-tab]').forEach(pane => { pane.hidden = pane.dataset.tab !== activeTab; });
      document.querySelectorAll('[data-tab-target]').forEach(tab => {
        const on = tab.dataset.tabTarget === activeTab;
        tab.setAttribute('aria-selected', String(on));
        tab.tabIndex = on ? 0 : -1;
      });
    };
    const selectTab = (name, focus) => {
      activeTab = name; sessionStorage.setItem('rapo-tab', name); applyTab(); window.scrollTo(0, 0);
      if (focus) document.getElementById(`tab-${name}`).focus();
    };
    document.querySelector('.tabs').addEventListener('click', (e) => { const t = e.target.closest('[data-tab-target]'); if (t) selectTab(t.dataset.tabTarget, false); });
    document.querySelector('.tabs').addEventListener('keydown', (e) => {
      const step = { ArrowRight: 1, ArrowLeft: -1 }[e.key];
      if (step) { e.preventDefault(); selectTab(TABS[(TABS.indexOf(activeTab) + step + TABS.length) % TABS.length], true); }
      else if (e.key === 'Home') { e.preventDefault(); selectTab(TABS[0], true); }
      else if (e.key === 'End') { e.preventDefault(); selectTab(TABS[TABS.length - 1], true); }
    });
    // In-place update. The host pushes a new snapshot about once a second (telemetry changes every time), and
    // replacing innerHTML recreated every control: an open <select> closed, typed text, focus and scroll were lost.
    // Instead the new markup is parsed off-screen and merged into the live DOM, touching only what differs.
    // A control the user has edited, or that has focus, keeps its live value; the host never overwrites typing.
    const dirty = new WeakSet();
    const markDirty = (e) => { if (e.target instanceof HTMLInputElement || e.target instanceof HTMLSelectElement || e.target instanceof HTMLTextAreaElement) dirty.add(e.target); };
    document.addEventListener('input', markDirty, true);
    document.addEventListener('change', markDirty, true);
    // Keyed by id, or by summary text (before any " · " state suffix) for <details>, so sections that appear or
    // disappear do not shift their neighbours. Repeated keys get an occurrence suffix.
    const keyOf = (n) => n.nodeType !== 1 ? null
      : n.id || (n.tagName === 'DETAILS' ? `details:${(n.querySelector(':scope > summary')?.textContent ?? '').split(' · ')[0].trim()}` : null);
    const keyList = (nodes) => { const seen = new Map(); return nodes.map((n) => { const k = keyOf(n); if (!k) return null; const c = seen.get(k) ?? 0; seen.set(k, c + 1); return c ? `${k}#${c}` : k; }); };
    const same = (a, b) => a.nodeType === b.nodeType && (a.nodeType !== 1 || (a.nodeName === b.nodeName && (a.nodeName !== 'INPUT' || a.type === b.type)));
    // Live state or state owned by this script: never copied from the markup.
    const skipAttr = (el, name) => (el.tagName === 'INPUT' && (name === 'value' || name === 'checked'))
      || (el.tagName === 'OPTION' && name === 'selected') || (el.tagName === 'DETAILS' && name === 'open')
      || (name === 'hidden' && ('tab' in el.dataset || 'vpnForm' in el.dataset));
    const syncAttrs = (a, b) => {
      for (const { name, value } of [...b.attributes]) if (!skipAttr(a, name) && a.getAttribute(name) !== value) a.setAttribute(name, value);
      for (const { name } of [...a.attributes]) if (!skipAttr(a, name) && !b.hasAttribute(name)) a.removeAttribute(name);
    };
    // Text-like controls take the host value only while untouched and unfocused.
    const setLive = (a, next) => {
      if (a.value !== next && a !== document.activeElement && !dirty.has(a)) a.value = next;
      if (a.value === next) dirty.delete(a);
    };
    const morphNode = (a, b) => {
      if (a.nodeType !== 1) { if (a.nodeValue !== b.nodeValue) a.nodeValue = b.nodeValue; return; }
      syncAttrs(a, b);
      if (a.tagName === 'TEXTAREA') { setLive(a, b.value); return; }
      if (a.tagName === 'INPUT') {
        if (a.type === 'checkbox' || a.type === 'radio') {
          const want = b.hasAttribute('checked');
          // A toggle with a data-action reflects the host; a form-only checkbox (consent, candidates) keeps the user's choice.
          if (a.checked !== want && (a.hasAttribute('data-action') || !dirty.has(a))) a.checked = want;
          if (a.checked === want) dirty.delete(a);
        } else if (a.type !== 'file') setLive(a, b.getAttribute('value') ?? '');
        return;
      }
      if (a.tagName === 'SELECT') {
        const chosen = a.value;
        morphChildren(a, b);
        if (dirty.has(a) && [...a.options].some((o) => o.value === chosen)) a.value = chosen;
        else if (a !== document.activeElement && a.selectedIndex !== b.selectedIndex) { a.selectedIndex = b.selectedIndex; dirty.delete(a); }
        return;
      }
      morphChildren(a, b);
    };
    const morphChildren = (from, to) => {
      const olds = [...from.childNodes], news = [...to.childNodes];
      const oldKeys = keyList(olds), newKeys = keyList(news);
      const byKey = new Map();
      oldKeys.forEach((k, i) => { if (k) byKey.set(k, olds[i]); });
      const used = new Set();
      let cursor = 0;
      const matches = news.map((next, i) => {
        let match = null;
        if (newKeys[i]) match = byKey.get(newKeys[i]) ?? null;
        else {
          while (cursor < olds.length && oldKeys[cursor]) cursor++; // unkeyed nodes only pair with unkeyed nodes
          if (cursor < olds.length && same(olds[cursor], next)) match = olds[cursor++];
        }
        if (match && !same(match, next)) match = null;
        if (match) used.add(match);
        return match;
      });
      olds.forEach((o) => { if (!used.has(o)) o.remove(); });
      let prev = null;
      news.forEach((next, i) => {
        const node = matches[i] ?? next;
        if (matches[i]) morphNode(matches[i], next);
        const want = prev ? prev.nextSibling : from.firstChild;
        if (node !== want) from.insertBefore(node, want);
        prev = node;
      });
    };
    const update = (id, view, render) => {
      const json = JSON.stringify(view);
      if (previous.get(id) === json) return;
      const root = document.getElementById(id);
      const template = document.createElement('template');
      template.innerHTML = render(json);
      const focusedId = root.contains(document.activeElement) ? document.activeElement.id : '';
      morphChildren(root, template.content);
      if (focusedId && document.activeElement?.id !== focusedId) document.getElementById(focusedId)?.focus({ preventScroll: true });
      previous.set(id, json);
      applyTab();
      showVpnForm();
    };
    // The host sends UI strings only in INITIAL_STATE; reuse them on every later update.
    const strings = { header: null, games: null };
    let renderFailed = false;
    window.rapoUpdate = (state) => {
      try {
        for (const key of ['header', 'games']) {
          if (state[key].strings) strings[key] = state[key].strings;
          else state[key].strings = strings[key] ?? {};
        }
        update('app', state.header, render_header_json);
        update('games', state.games, render_games_json);
        update('training', state.training, render_training_json);
        update('dashboard', state.dashboard, render_dashboard_json);
        update('summary', state.dashboard, render_summary_json);
        applyTab();
        if (document.activeElement !== search) search.value = state.dashboard.search;
        if (renderFailed) { error.textContent = ''; renderFailed = false; }
      } catch (e) { renderFailed = true; error.textContent = `Falha ao renderizar a interface: ${e}`; }
    };
    window.rapoUpdate(window.INITIAL_STATE);
  } catch (e) { error.textContent = `Falha ao carregar a interface wasm: ${e}`; }
</script>
</body></html>
