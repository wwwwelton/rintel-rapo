<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self'; object-src 'none'; base-uri 'none'">
<title>Rintel RAPO</title>
<style>
  body { margin: 0; background: #050c13; color: #f3f8fb; font: 14px "Segoe UI", sans-serif; }
  main { max-width: 1400px; margin: auto; padding: 16px; }
  .rapo-header, .actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .rapo-header h1 { font-size: 24px; margin: 0; }
  .actions { margin-left: auto; }
  .badge { font-size: 11px; padding: 3px 8px; border-radius: 4px; border: 1px solid currentColor; }
  .badge-accent { color: #46e0d5; } .badge-warning { color: #ffd96b; } .badge-muted { color: #8da9bb; }
  button, input { background: #0c1a27; color: inherit; border: 1px solid #1e394c; padding: 6px 10px; border-radius: 4px; }
  button { cursor: pointer; } button:disabled { opacity: .4; cursor: default; }
  :focus-visible { outline: 2px solid #55d7ff; outline-offset: 2px; }
  section, article, .game { background: #091520; border: 1px solid #1e394c; padding: 14px; border-radius: 10px; margin: 10px 0; overflow-wrap: anywhere; }
  h2 { font-size: 14px; } p, dd { color: #8da9bb; } dd { margin: 6px 0; }
  .metrics, .cores { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
  .alert { color: #ff6877; } ul { padding: 0; list-style: none; }
  .game { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
  .name { font-weight: bold; margin-right: auto; } label { display: inline-block; margin: 4px; }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; }
</style>
</head>
<body><main>
<div id="app"></div>
<div id="training"></div>
<div id="dashboard"></div>
<label for="search">Buscar jogo</label> <input id="search" type="search" placeholder="Buscar jogo...">
<div id="games"></div>
<p id="ui-error" role="alert"></p>
</main>
<script type="module">
  import init, { render_header_json, render_games_json, render_training_json, render_dashboard_json } from './rapo_ui.js';
  const error = document.getElementById('ui-error');
  try {
    await init();
    const search = document.getElementById('search');
    const send = (el) => window.ipc.postMessage(JSON.stringify({ action: el.dataset.action, dir: el.dataset.dir ?? null, checked: el.checked ?? null, pid: el.dataset.pid ? Number(el.dataset.pid) : null }));
    document.addEventListener('change', (e) => { if (e.target.matches('input[data-action]')) send(e.target); });
    document.addEventListener('click', (e) => { const b = e.target.closest('button[data-action]'); if (b && !b.disabled) send(b); });
    search.addEventListener('input', () => window.ipc.postMessage(JSON.stringify({ action: 'search', text: search.value })));
    const previous = new Map();
    const update = (id, view, render) => {
      const json = JSON.stringify(view);
      if (previous.get(id) !== json) {
        const root = document.getElementById(id);
        const focused = root.contains(document.activeElement) ? { id: document.activeElement.id, data: { ...document.activeElement.dataset } } : null;
        const openDetails = [...root.querySelectorAll('details')].map(el => el.open);
        root.innerHTML = render(json);
        root.querySelectorAll('details').forEach((el, i) => { el.open = openDetails[i] ?? false; });
        if (focused) {
          const replacement = focused.id ? document.getElementById(focused.id) : [...root.querySelectorAll('[data-action]')].find(el => el.dataset.action === focused.data.action && el.dataset.dir === focused.data.dir && el.dataset.pid === focused.data.pid);
          replacement?.focus({ preventScroll: true });
        }
        previous.set(id, json);
      }
    };
    let sampleFrames = false;
    let animation = null;
    const frame = () => {
      animation = null;
      if (!sampleFrames) return;
      if (!document.hidden) window.ipc.postMessage('{"action":"frame"}');
      animation = requestAnimationFrame(frame);
    };
    window.rapoUpdate = (state) => {
      try {
        update('app', state.header, render_header_json);
        update('games', state.games, render_games_json);
        update('training', state.training, render_training_json);
        update('dashboard', state.dashboard, render_dashboard_json);
        if (document.activeElement !== search) search.value = state.dashboard.search;
        sampleFrames = state.dashboard.running.length > 0;
        if (sampleFrames && animation === null) animation = requestAnimationFrame(frame);
        error.textContent = '';
      } catch (e) { error.textContent = `Falha ao renderizar a interface: ${e}`; }
    };
    window.rapoUpdate(window.INITIAL_STATE);
  } catch (e) { error.textContent = `Falha ao carregar a interface wasm: ${e}`; }
</script>
</body></html>
