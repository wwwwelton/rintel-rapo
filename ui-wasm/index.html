<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self'; object-src 'none'; base-uri 'none'">
<title>Rintel RAPO</title>
<style>
  body { margin: 0; background: #050c13; color: #f3f8fb; font: 14px "Segoe UI", -apple-system, sans-serif; }
  main { max-width: 1400px; margin: auto; padding: 16px; }
  .rapo-header, .actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .rapo-header h1 { font-size: 24px; margin: 0; font-weight: 800; letter-spacing: -0.5px; color: #f3f8fb; }
  .actions { margin-left: auto; }
  .badge { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 4px; border: 1px solid currentColor; letter-spacing: 0.04em; }
  .badge-accent { color: #46e0d5; border-color: rgba(70,224,213,0.4); background: rgba(70,224,213,0.1); }
  .badge-warning { color: #ffd96b; border-color: rgba(255,217,107,0.4); background: rgba(255,217,107,0.1); }
  .badge-muted { color: #8da9bb; border-color: rgba(141,169,187,0.3); background: rgba(141,169,187,0.08); }
  button, input, select { background: #0c1a27; color: inherit; border: 1px solid #1e394c; padding: 7px 12px; border-radius: 6px; font-size: 13px; font-family: inherit; transition: all .15s ease; max-width: 100%; box-sizing: border-box; }
  button { cursor: pointer; font-weight: 600; }
  button:hover:not(:disabled) { background: #102230; border-color: #46e0d5; color: #46e0d5; }
  button:disabled { opacity: .4; cursor: default; }
  :focus-visible { outline: 2px solid #55d7ff; outline-offset: 2px; }
  section, article, .game { background: #091520; border: 1px solid #1e394c; padding: 16px; border-radius: 10px; margin: 12px 0; overflow-wrap: anywhere; box-shadow: 0 4px 16px rgba(0,0,0,0.3); }
  h2 { font-size: 13px; font-weight: 750; letter-spacing: 0.05em; color: #8da9bb; text-transform: uppercase; margin-top: 0; margin-bottom: 12px; }
  h3 { font-size: 12px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; margin: 10px 0 6px; }
  p, dd { color: #8da9bb; line-height: 1.5; } dd { margin: 6px 0; }
  .alert { color: #ff6877; font-weight: 600; } ul { padding: 0; list-style: none; }
  .telemetry-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; margin: 12px 0; }
  .telemetry-box { background: #0c1a27; border: 1px solid #1e394c; border-radius: 8px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; box-shadow: 0 2px 8px rgba(0,0,0,0.25); transition: border-color .15s ease; }
  .telemetry-box:hover { border-color: #46e0d5; }
  .box-label { font-size: 11px; font-weight: 700; color: #8da9bb; text-transform: uppercase; letter-spacing: 0.05em; }
  .box-value { font-size: 22px; font-weight: 750; color: #46e0d5; line-height: 1.2; }
  .box-sub { font-size: 11px; color: #68869a; margin-top: 2px; }
  .telemetry-box-wide { grid-column: 1 / -1; }
  .net-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin: 10px 0; }
  .net-card { background: #0c1a27; border: 1px solid #1e394c; border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; transition: border-color .15s ease; }
  .net-card:hover { border-color: #46e0d5; }
  .net-card-label { font-size: 10px; font-weight: 700; color: #68869a; text-transform: uppercase; letter-spacing: 0.06em; }
  .net-card-value { font-size: 18px; font-weight: 750; line-height: 1.2; }
  .net-card-sub { font-size: 11px; color: #68869a; }
  .net-card-active { border-color: rgba(70,224,213,0.4); } .net-card-active .net-card-value { color: #46e0d5; }
  .net-card-warn { border-color: rgba(255,217,107,0.3); } .net-card-warn .net-card-value { color: #ffd96b; }
  .net-card-off .net-card-value { color: #8da9bb; }
  .net-card-wide { grid-column: 1 / -1; }
  .net-history { margin: 4px 0 0; padding: 0; list-style: none; } .net-history li { font-size: 11px; color: #68869a; padding: 3px 0; border-bottom: 1px solid #142a39; display: flex; justify-content: space-between; gap: 8px; } .net-history li span:last-child { color: #46e0d5; font-weight: 600; white-space: nowrap; }
  .net-policy-table { width: 100%; border-collapse: collapse; margin: 6px 0; font-size: 12px; } .net-policy-table th { text-align: left; color: #68869a; font-weight: 600; font-size: 10px; text-transform: uppercase; padding: 4px 8px; border-bottom: 1px solid #1e394c; } .net-policy-table td { padding: 5px 8px; color: #f3f8fb; } .net-policy-table tr:hover td { background: rgba(70,224,213,0.04); }
  .net-disclaimer { font-size: 10px; color: #536b7a; margin-top: 4px; }
  .relay-predictions { overflow-x: auto; min-width: 0; }
  .core-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; margin: 12px 0; }
  .core-box { background: #0c1a27; border: 1px solid #142a39; border-radius: 6px; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; }
  .core-header { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .core-num { font-size: 12px; font-family: monospace; font-weight: 700; color: #f3f8fb; }
  .core-pct { font-size: 12px; font-family: monospace; font-weight: 700; color: #f3f8fb; }
  .core-bar-bg { background: #091520; height: 6px; border-radius: 3px; overflow: hidden; width: 100%; }
  .core-bar-fill { height: 100%; border-radius: 3px; transition: width .2s ease; }
  .core-low { background: #46e0d5; } .core-med { background: #ffd96b; } .core-high { background: #ff6877; }
  .cache-badges { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .property-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; margin: 12px 0; }
  .property-box { background: #0c1a27; border: 1px solid #1e394c; border-radius: 8px; padding: 14px 16px; display: flex; align-items: flex-start; gap: 12px; transition: border-color .15s ease; box-shadow: 0 2px 8px rgba(0,0,0,0.25); }
  .property-box:hover { border-color: #55d7ff; }
  .property-toggle { display: flex; align-items: flex-start; gap: 12px; cursor: pointer; width: 100%; margin: 0; }
  .property-toggle input { margin-top: 2px; accent-color: #46e0d5; width: 16px; height: 16px; cursor: pointer; flex-shrink: 0; }
  .property-text { display: flex; flex-direction: column; gap: 2px; }
  .property-name { font-size: 13px; font-weight: 700; color: #f3f8fb; }
  .property-desc { font-size: 11px; color: #8da9bb; line-height: 1.4; }
  .property-box-action { flex-direction: column; gap: 10px; justify-content: space-between; }
  .btn-elevate { align-self: flex-start; border-color: #55d7ff; color: #55d7ff; }
  .btn-elevate:hover { background: #163044; }
  .parameters { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin: 12px 0; }
  .parameter { border: 1px solid #1e394c; border-radius: 8px; padding: 12px 14px; background: #0c1a27; box-shadow: 0 2px 6px rgba(0,0,0,0.2); }
  .parameter dt { font-size: 11px; color: #8da9bb; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
  .parameter dd { font-size: 17px; font-weight: 750; margin: 6px 0 0; color: #f3f8fb; }
  .parameter small { font-size: 10px; color: #68869a; display: block; margin-top: 4px; }
  .parameter-on { border-color: #46e0d5; } .parameter-off { border-style: dashed; border-color: #1e394c; }
  .training-live, .profile-applied { border: 2px solid #46e0d5; box-shadow: 0 0 20px rgba(70,224,213,0.15); }
  .training-paused { border: 2px solid #ffd96b; box-shadow: 0 0 20px rgba(255,217,107,0.15); }
  .training h3, .profile-summary h3 { font-size: 12px; letter-spacing: .06em; color: #55d7ff; }
  .training-paused h3 { color: #ffd96b; }
  .profile-source { font-size: 18px; font-weight: 750; color: #f3f8fb; margin: 4px 0 8px; }
  .applied-settings { display: flex; flex-wrap: wrap; gap: 10px; margin: 12px 0; }
  .applied-settings span { padding: 8px 12px; background: #0c1a27; border: 1px solid #1e394c; border-radius: 6px; font-size: 12px; color: #8da9bb; }
  .applied-settings b { color: #f3f8fb; }
  .best-score { border-left: 3px solid #46e0d5; padding: 10px 14px; color: #46e0d5; font-weight: 700; background: rgba(70,224,213,0.06); border-radius: 0 6px 6px 0; }
  .power-plan { border-left: 3px solid #55d7ff; background: rgba(85,215,255,0.04); }
  .game { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; border-radius: 8px; padding: 12px 16px; }
  .game:hover { border-color: #46e0d5; }
  .name { font-weight: 750; font-size: 15px; margin-right: auto; color: #f3f8fb; }
  .search-bar { display: flex; align-items: center; gap: 10px; margin: 16px 0 8px; }
  .search-bar input { flex: 1; max-width: 320px; }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; }
  #network-routes fieldset { border: 1px solid #1e394c; border-radius: 6px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; min-width: 0; margin-bottom: 12px; }
  #network-routes h3, #network-routes fieldset p, .network-choice { flex-basis: 100%; }
  .network-choice { display: flex; gap: 8px; align-items: flex-start; overflow-wrap: anywhere; }
  #network-routes button { margin: 3px 0; }
  #relay-transport { display: grid; gap: 6px; min-width: 0; margin: 8px 0; border: 1px solid #1e394c; border-radius: 6px; }
  #relay-transport input, #relay-transport select, #relay-transport textarea { width: 100%; box-sizing: border-box; min-width: 0; }
</style>
</head>
<body><main>
<div id="app"></div>
<div id="training"></div>
<div id="dashboard"></div>
<div class="search-bar"><label for="search">Buscar jogo</label> <input id="search" type="search" placeholder="Buscar jogo na biblioteca Steam..."></div>
<div id="games"></div>
<p id="ui-error" role="alert"></p>
</main>
<script type="module">
  import init, { render_header_json, render_games_json, render_training_json, render_dashboard_json } from './rapo_ui.js';
  const error = document.getElementById('ui-error');
  try {
    await init();
    const search = document.getElementById('search');
    const send = (el) => {
      const action = el.dataset.action;
      const payload = { action, dir: el.dataset.dir ?? null, checked: el.checked ?? null, pid: el.dataset.pid ? Number(el.dataset.pid) : null };
      const field = (id) => document.getElementById(id);
      if (action === 'relay-interfaces') payload.candidates = [...document.querySelectorAll('[data-relay-candidate]:checked')].map(input => input.dataset.relayCandidate);
      if (action === 'relay-configure') {
        payload.mode = field('relay-mode').value;
        payload.server = field('relay-server').value.trim();
        payload.server_name = field('relay-server-name').value.trim();
        payload.auth = field('relay-auth').value;
        payload.ca_pem = field('relay-ca').value;
        if (['hy2', 'neural_auto'].includes(payload.mode) && (!payload.server || !payload.auth)) {
          error.textContent = 'Informe servidor e autenticação HY2.'; return;
        }
        field('relay-auth').value = '';
      }
      if (action.startsWith('route-') || action.startsWith('rate-')) {
        payload.destination = el.dataset.destination ?? field('route-destination')?.value.trim();
        payload.candidate = field('route-candidate')?.value;
        payload.consent = field('network-consent')?.checked === true;
        payload.candidates = [...document.querySelectorAll('[data-route-candidate]:checked')].map(input => input.dataset.routeCandidate);
        payload.mbps = field('rate-mbps')?.value.trim();
        payload.rates = (field('rate-list')?.value ?? '').split(',').map(value => value.trim());
        const rateValid = (value) => /^\d+(\.\d{1,6})?$/.test(value) && /[1-9]/.test(value);
        if (['route-apply', 'route-learn', 'rate-learn'].includes(action) && !payload.destination) { error.textContent = 'Informe um IP de destino numérico.'; return; }
        if (action === 'route-apply' && !payload.candidate) { error.textContent = 'Selecione uma interface/gateway existente.'; return; }
        if (action.endsWith('-learn') && !payload.consent) { error.textContent = 'Confirme explicitamente o consentimento aos testes ativos de rede.'; return; }
        if (action === 'route-learn' && payload.candidates.length < 2) { error.textContent = 'Selecione a saída atual e pelo menos outra saída da mesma família.'; return; }
        if (action === 'rate-apply' && !rateValid(payload.mbps ?? '')) { error.textContent = 'Informe Mbps decimal positivo com até 6 casas.'; return; }
        if (action === 'rate-learn' && (payload.rates.length < 2 || !payload.rates.every(rateValid))) { error.textContent = 'Autorize pelo menos duas taxas Mbps positivas, separadas por vírgula.'; return; }
      }
      window.ipc.postMessage(JSON.stringify(payload));
    };
    document.addEventListener('change', (e) => { if (e.target.matches('input[data-action]')) send(e.target); });
    document.addEventListener('click', (e) => { const b = e.target.closest('button[data-action]'); if (b && !b.disabled) send(b); });
    search.addEventListener('input', () => window.ipc.postMessage(JSON.stringify({ action: 'search', text: search.value })));
    const previous = new Map();
    const update = (id, view, render) => {
      const json = JSON.stringify(view);
      if (previous.get(id) !== json) {
        const root = document.getElementById(id);
        const focused = root.contains(document.activeElement) ? { id: document.activeElement.id, data: { ...document.activeElement.dataset } } : null;
        const openDetails = [...root.querySelectorAll('details')].map(el => el.open);
        const networkDrafts = [...root.querySelectorAll('[data-network-draft]')].map(el => ({ key: el.dataset.networkDraft, value: el.value, checked: el.checked, start: el.selectionStart, end: el.selectionEnd }));
        root.innerHTML = render(json);
        root.querySelectorAll('details').forEach((el, i) => { el.open = openDetails[i] ?? false; });
        root.querySelectorAll('[data-network-draft]').forEach(el => {
          const draft = networkDrafts.find(d => d.key === el.dataset.networkDraft);
          if (!draft) return;
          if (el.type === 'checkbox') el.checked = draft.checked;
          else { el.value = draft.value; if (draft.start !== null && typeof el.setSelectionRange === 'function' && el.tagName === 'INPUT') el.setSelectionRange(draft.start, draft.end); }
        });
        if (focused) {
          const replacement = focused.id ? document.getElementById(focused.id) : [...root.querySelectorAll('[data-action]')].find(el => el.dataset.action === focused.data.action && el.dataset.dir === focused.data.dir && el.dataset.pid === focused.data.pid);
          replacement?.focus({ preventScroll: true });
        }
        previous.set(id, json);
      }
    };
    let sampleFrames = false;
    let animation = null;
    const frame = () => {
      animation = null;
      if (!sampleFrames) return;
      if (!document.hidden) window.ipc.postMessage('{"action":"frame"}');
      animation = requestAnimationFrame(frame);
    };
    window.rapoUpdate = (state) => {
      try {
        update('app', state.header, render_header_json);
        update('games', state.games, render_games_json);
        update('training', state.training, render_training_json);
        update('dashboard', state.dashboard, render_dashboard_json);
        if (document.activeElement !== search) search.value = state.dashboard.search;
        sampleFrames = state.dashboard.running.length > 0;
        if (sampleFrames && animation === null) animation = requestAnimationFrame(frame);
        error.textContent = '';
      } catch (e) { error.textContent = `Falha ao renderizar a interface: ${e}`; }
    };
    window.rapoUpdate(window.INITIAL_STATE);
  } catch (e) { error.textContent = `Falha ao carregar a interface wasm: ${e}`; }
</script>
</body></html>
