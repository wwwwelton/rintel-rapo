[package]
name = "rapo-ui"
version = "0.1.0"
edition = "2021"
description = "Rintel RAPO webview UI: pure render logic compiled to wasm"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Must match the wasm-bindgen-cli version used by scripts/build-ui.sh.
wasm-bindgen = "=0.2.130"
