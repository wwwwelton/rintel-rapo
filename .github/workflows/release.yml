name: Build / Test / Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-release:
    name: Build, Test & Release (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust build cache
        uses: Swatinem/rust-cache@v2

      - name: Add wasm target and wasm-bindgen CLI
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.130 --locked

      - name: Build webview UI (wasm)
        shell: bash
        run: scripts/build-ui.sh

      - name: 1. Build (Windows Release Binary)
        run: cargo build --release

      - name: 2. Test (Windows Unit & Integration Suite)
        run: cargo test --workspace

      - name: 📋 Show build environment
        run: |
          echo "=== Windows Build Environment ==="
          rustc --version
          cargo --version
          echo "=== Target Configuration ==="
          cargo build --release --message-format=json 2>&1 | jq '.executable' | head -5
      - name: Sign executable with Authenticode SHA-256 & DigiCert Timestamp
        shell: pwsh
        run: |
          $exePath = "target\release\rintel-rapo.exe"
          $cerPath = "target\release\rintel-rapo.cer"
          $cert = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject "CN=Rintel RAPO Open Source, O=Rintel Project, C=BR" `
            -KeyAlgorithm RSA `
            -KeyLength 2048 `
            -HashAlgorithm SHA256 `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -NotAfter (Get-Date).AddYears(5)

          Export-Certificate -Cert $cert -FilePath $cerPath -Force | Out-Null

          $sig = Set-AuthenticodeSignature `
            -FilePath $exePath `
            -Certificate $cert `
            -HashAlgorithm SHA256 `
            -TimestampServer "http://timestamp.digicert.com"

          if (-not $sig.SignerCertificate) {
            Set-AuthenticodeSignature -FilePath $exePath -Certificate $cert -HashAlgorithm SHA256 | Out-Null
          }

          Get-AuthenticodeSignature -FilePath $exePath | Select-Object Status, SignerCertificate, TimeStamperCertificate | Format-List
      - name: 🔍 Verify executable & assets
        shell: pwsh
        run: |
          Write-Host "=== Built Artifacts ===" -ForegroundColor Cyan
          Get-Item "target\release\rintel-rapo.exe" | ForEach-Object { Write-Host "✓ $_"; Write-Host "  Size: $([math]::Round($_.Length / 1MB, 2)) MB" }
          Write-Host "`n=== Signed certificate ===" -ForegroundColor Cyan
          Get-AuthenticodeSignature "target\release\rintel-rapo.exe" | ForEach-Object {
            Write-Host "Status: $($_.Status)"
            Write-Host "Signer: $($_.SignerCertificate.Subject)"
            if ($_.TimeStamperCertificate) { Write-Host "Timestamp: $($_.TimeStamperCertificate.Subject)" }
          }

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $hash = & "target\release\rintel-rapo.exe" --generate-sha256
          "$hash" | Out-File -FilePath "target\release\rintel-rapo.exe.sha256" -Encoding ascii
      - name: 📦 Release artifacts ready
        shell: pwsh
        run: |
          Write-Host "=== Release Package ===" -ForegroundColor Green
          @(
            "target/release/rintel-rapo.exe",
            "target/release/rintel-rapo.exe.sha256",
            "target/release/rintel-rapo.cer"
          ) | ForEach-Object {
            if (Test-Path $_) {
              $item = Get-Item $_
              Write-Host "✓ $($item.Name) - $([math]::Round($item.Length / 1KB, 1)) KB"
            } else {
              throw "Required release artifact is missing: $_"
            }
          }
          Write-Host "`nTagging release: v0.2.${{ github.run_number }}" -ForegroundColor Yellow

      - name: 3. Release (Manual publication after Windows validation)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.${{ github.run_number }}
          name: "Rintel RAPO v0.2.${{ github.run_number }} (${{ github.sha }})"
          generate_release_notes: true
          make_latest: "true"
          fail_on_unmatched_files: true
          files: |
            target/release/rintel-rapo.exe
            target/release/rintel-rapo.exe.sha256
            target/release/rintel-rapo.cer
