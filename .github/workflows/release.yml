name: Build / Test / Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-release:
    name: Build, Test & Release (Windows x64)
    runs-on: windows-latest
    env:
      # Same value for every cargo invocation: build.rs reruns when it changes and must never drop the sealed server.
      RAPO_HY2_PROFILE_JSON: ${{ secrets.RAPO_HY2_PROFILE_JSON }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Require the built-in Hysteria 2 profile
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RAPO_HY2_PROFILE_JSON)) {
            throw "Secret RAPO_HY2_PROFILE_JSON is missing: the release would ship without the integrated Hysteria 2 server."
          }

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust build cache
        uses: Swatinem/rust-cache@v2

      - name: Install Go for the embedded HY2 library
        uses: actions/setup-go@v7
        with:
          go-version-file: native/hy2/go.mod
          cache-dependency-path: native/hy2/go.sum

      - name: Check cgo toolchain (go build -buildmode=c-shared needs gcc)
        shell: bash
        run: |
          go version
          gcc --version

      - name: Add wasm target and wasm-bindgen CLI
        run: |
          rustup target add wasm32-unknown-unknown
          Push-Location $env:RUNNER_TEMP
          try {
            cargo install wasm-bindgen-cli --version 0.2.130 --locked
            if ($LASTEXITCODE -ne 0) { throw "wasm-bindgen CLI installation failed" }
          } finally { Pop-Location }

      - name: Build webview UI (wasm)
        shell: bash
        run: scripts/build-ui.sh

      - name: 1. Build (Windows Release Binary)
        run: cargo build --release

      - name: 2. Test (Windows Unit & Integration Suite)
        run: cargo test --workspace

      - name: Reject corrupted bundled driver without installing it
        shell: pwsh
        run: ./scripts/test-prepare-wfp.ps1

      - name: 📋 Show build environment
        run: |
          echo "=== Windows Build Environment ==="
          rustc --version
          cargo --version
          echo "=== Target Configuration ==="
          cargo build --release --message-format=json 2>&1 | jq '.executable' | head -5
      - name: Sign executable with Authenticode SHA-256 & DigiCert Timestamp
        shell: pwsh
        timeout-minutes: 3
        run: |
          Write-Host "Generating release certificate..."
          $cert = New-SelfSignedCertificate -Type CodeSigningCert `
            -Subject "CN=Rintel RAPO Open Source, O=Rintel Project, C=BR" `
            -KeyAlgorithm RSA -KeyLength 2048 -HashAlgorithm SHA256 `
            -CertStoreLocation "Cert:\CurrentUser\My" -NotAfter (Get-Date).AddYears(5)
          $cerPath = Join-Path $env:RUNNER_TEMP "rintel-rapo.cer"
          Export-Certificate -Cert $cert -FilePath $cerPath | Out-Null
          # LocalMachine avoids the interactive CurrentUser root-trust dialog on the disposable runner.
          Write-Host "Trusting release certificate on disposable runner..."
          certutil.exe -addstore -f Root $cerPath
          if ($LASTEXITCODE -ne 0) { throw "Runner certificate import failed: $LASTEXITCODE" }
          Write-Host "Signing release executable..."
          ./scripts/sign-release.ps1 -ExePath target/release/rintel-rapo.exe
          $sig = Get-AuthenticodeSignature "target/release/rintel-rapo.exe"
          if ($sig.Status -ne "Valid" -or $sig.SignerCertificate.Thumbprint -ne $cert.Thumbprint) {
            throw "Release signature must be valid and use the certificate generated by this job."
          }
      - name: Stage Mudfish WFP bundle beside the executable
        shell: pwsh
        run: ./scripts/stage-wfp-bundle.ps1 -OutDir target/release
      - name: 🔍 Verify executable & assets
        shell: pwsh
        run: |
          Write-Host "=== Built Artifacts ===" -ForegroundColor Cyan
          Get-Item "target\release\rintel-rapo.exe" | ForEach-Object { Write-Host "✓ $_"; Write-Host "  Size: $([math]::Round($_.Length / 1MB, 2)) MB" }
          Write-Host "`n=== Signed certificate ===" -ForegroundColor Cyan
          Get-AuthenticodeSignature "target\release\rintel-rapo.exe" | ForEach-Object {
            Write-Host "Status: $($_.Status)"
            Write-Host "Signer: $($_.SignerCertificate.Subject)"
            if ($_.TimeStamperCertificate) { Write-Host "Timestamp: $($_.TimeStamperCertificate.Subject)" }
          }

      - name: 📦 Release artifacts ready
        shell: pwsh
        run: |
          Write-Host "=== Release Package ===" -ForegroundColor Green
          @(
            "target/release/rintel-rapo.exe",
            "target/release/rintel-rapo.exe.sha256",
            "target/release/rintel-rapo.cer",
            "target/release/mudwfp_proxy.exe",
            "target/release/rintel-rapo-windows-x64.zip",
            "target/release/rintel-rapo-windows-x64.zip.sha256",
            "target/release/DRIVERS/MUDWFP.sys",
            "target/release/wfp/MUDWFP.sys",
            "target/release/wfp/mudwfp_proxy.exe",
            "target/release/wfp/mudwfp.inf",
            "native/hy2/THIRD_PARTY_NOTICES.txt",
            "ui-screen.svg",
            "ui-screen.json",
            "vendor/wfp/NOTICE.md"
          ) | ForEach-Object {
            if (Test-Path $_) {
              $item = Get-Item $_
              Write-Host "✓ $($item.Name) - $([math]::Round($item.Length / 1KB, 1)) KB"
            } else {
              throw "Required release artifact is missing: $_"
            }
          }
          Write-Host "`nTagging release: v0.2.${{ github.run_number }}" -ForegroundColor Yellow

      - name: 3. Release (Manual publication after Windows validation)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: "Rintel RAPO v0.2.${{ github.run_number }} (${{ github.sha }})"
          generate_release_notes: true
          make_latest: "true"
          fail_on_unmatched_files: true
          files: |
            target/release/rintel-rapo.exe
            target/release/rintel-rapo.exe.sha256
            target/release/rintel-rapo.cer
            target/release/rintel-rapo-windows-x64.zip
            target/release/rintel-rapo-windows-x64.zip.sha256
            target/release/mudwfp_proxy.exe
            target/release/DRIVERS/MUDWFP.sys
            target/release/wfp/mudwfp.inf
            native/hy2/THIRD_PARTY_NOTICES.txt
            ui-screen.svg
            ui-screen.json
            vendor/wfp/NOTICE.md
